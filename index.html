<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Metronome App</title>

    <!-- ========================================== -->
    <!-- CATEGORY 1: CSS STYLES                     -->
    <!-- ========================================== -->
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2a2a2a;
            --accent-color: #00e676;
            --accent-danger: #ff5252;
            --text-color: #ffffff;
            --text-dim: #aaaaaa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h1, h2 {
            margin-top: 0;
            text-align: center;
        }

        .control-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .bpm-display {
            font-size: 48px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            background-color: #3a3a3a;
            color: var(--text-color);
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #4a4a4a;
        }

        button.btn-primary {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
        }

        button.btn-danger {
            background-color: var(--accent-danger);
        }

        input[type="text"], input[type="number"] {
            background: #1a1a1a;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        /* Preset Section Styles */
        .preset-form {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .preset-form input {
            flex: 1;
        }

        .preset-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .preset-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222;
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        /* Floating Window Styles */
        #floating-widget {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid var(--accent-color);
            border-radius: 10dp;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 9999;
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
            cursor: move;
            user-select: none;
        }

        #floating-widget.hidden {
            display: none;
        }

        .drag-handle {
            font-size: 12px;
            color: var(--text-dim);
            margin-right: 4px;
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- CATEGORY 2: MAIN USER INTERFACE HTML       -->
    <!-- ========================================== -->
    <div class="app-container">
        <h1>Metronome</h1>

        <!-- Core Controls -->
        <div class="control-panel">
            <div class="bpm-display"><span id="bpm-text">120</span> <span style="font-size: 18px;">BPM</span></div>
            <input type="range" id="bpm-slider" min="30" max="300" value="120" style="width: 80%;">
            
            <div class="btn-group">
                <button id="btn-minus-five">-5</button>
                <button id="btn-toggle-play" class="btn-primary">START</button>
                <button id="btn-plus-five">+5</button>
            </div>

            <button id="btn-toggle-overlay" style="margin-top: 10px;">Toggle Floating Mode</button>
        </div>

        <hr style="border-color: #333; margin: 20px 0;">

        <!-- Preset Management -->
        <h2>Saved Presets</h2>
        <div class="preset-form">
            <input type="text" id="preset-name" placeholder="Preset Name (e.g., Practice Song)">
            <button id="btn-save-preset">Save</button>
        </div>
        <ul id="preset-list" class="preset-list"></ul>
    </div>


    <!-- ========================================== -->
    <!-- CATEGORY 3: FLOATING OVERLAY WIDGET HTML   -->
    <!-- ========================================== -->
    <div id="floating-widget" class="hidden">
        <span class="drag-handle">⠿</span>
        <span id="float-bpm-text" style="font-weight: bold; color: var(--accent-color);">120 BPM</span>
        <button id="btn-float-minus">-</button>
        <button id="btn-float-play" class="btn-primary">▶</button>
        <button id="btn-float-plus">+</button>
    </div>


    <!-- ========================================== -->
    <!-- CATEGORY 4: AUDIO ENGINE (WEB AUDIO API)   -->
    <!-- ========================================== -->
    <script>
        class MetronomeAudioEngine {
            constructor() {
                this.audioCtx = null;
                this.isPlaying = false;
                this.bpm = 120;
                this.nextNoteTime = 0.0;
                this.timerID = null;
                this.lookahead = 25.0; // Interval in ms to schedule audio
                this.scheduleAheadTime = 0.1; // Seconds to look ahead
            }

            init() {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playClick(time) {
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, time); // High pitched click (A5)
                gain.gain.setValueAtTime(1, time);
                gain.gain.exponentialRampToValueAtTime(0.001, time + 0.03);

                osc.connect(gain);
                gain.connect(this.audioCtx.destination);

                osc.start(time);
                osc.stop(time + 0.03);
            }

            scheduler() {
                while (this.nextNoteTime < this.audioCtx.currentTime + this.scheduleAheadTime) {
                    this.playClick(this.nextNoteTime);
                    const secondsPerBeat = 60.0 / this.bpm;
                    this.nextNoteTime += secondsPerBeat;
                }
                this.timerID = setTimeout(() => this.scheduler(), this.lookahead);
            }

            start() {
                this.init();
                if (this.audioCtx.state === 'suspended') {
                    this.audioCtx.resume();
                }
                this.isPlaying = true;
                this.nextNoteTime = this.audioCtx.currentTime + 0.05;
                this.scheduler();
            }

            stop() {
                this.isPlaying = false;
                clearTimeout(this.timerID);
            }
        }

        const engine = new MetronomeAudioEngine();
    </script>


    <!-- ========================================== -->
    <!-- CATEGORY 5: PRESET STORAGE (LOCALSTORAGE)  -->
    <!-- ========================================== -->
    <script>
        class PresetStore {
            constructor() {
                this.storageKey = 'metronome_presets';
            }

            getPresets() {
                const data = localStorage.getItem(this.storageKey);
                return data ? JSON.parse(data) : [];
            }

            savePreset(name, bpm) {
                const presets = this.getPresets();
                presets.push({ id: Date.now(), name, bpm });
                localStorage.setItem(this.storageKey, JSON.stringify(presets));
            }

            deletePreset(id) {
                let presets = this.getPresets();
                presets = presets.filter(p => p.id !== id);
                localStorage.setItem(this.storageKey, JSON.stringify(presets));
            }
        }

        const presetStore = new PresetStore();
    </script>


    <!-- ========================================== -->
    <!-- CATEGORY 6: DRAGGABLE FLOATING CONTROLLER  -->
    <!-- ========================================== -->
    <script>
        function setupDraggableOverlay() {
            const widget = document.getElementById('floating-widget');
            let isDragging = false;
            let offsetX = 0, offsetY = 0;

            widget.addEventListener('mousedown', (e) => {
                if (e.target.tagName === 'BUTTON') return; // Prevent drag on button clicks
                isDragging = true;
                offsetX = e.clientX - widget.offsetLeft;
                offsetY = e.clientY - widget.offsetTop;
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                widget.style.left = `${e.clientX - offsetX}px`;
                widget.style.top = `${e.clientY - offsetY}px`;
                widget.style.right = 'auto'; // Disable initial right-alignment
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
            });
        }

        setupDraggableOverlay();
    </script>


    <!-- ========================================== -->
    <!-- CATEGORY 7: MAIN APPLICATION BINDINGS     -->
    <!-- ========================================== -->
    <script>
        // DOM Elements
        const bpmText = document.getElementById('bpm-text');
        const floatBpmText = document.getElementById('float-bpm-text');
        const bpmSlider = document.getElementById('bpm-slider');
        const btnTogglePlay = document.getElementById('btn-toggle-play');
        const btnFloatPlay = document.getElementById('btn-float-play');
        const floatingWidget = document.getElementById('floating-widget');
        const presetList = document.getElementById('preset-list');

        function updateBpm(newBpm) {
            const clamped = Math.min(Math.max(newBpm, 30), 300);
            engine.bpm = clamped;
            bpmText.innerText = clamped;
            floatBpmText.innerText = `${clamped} BPM`;
            bpmSlider.value = clamped;
        }

        function togglePlayback() {
            if (engine.isPlaying) {
                engine.stop();
                btnTogglePlay.innerText = 'START';
                btnTogglePlay.classList.remove('btn-danger');
                btnFloatPlay.innerText = '▶';
            } else {
                engine.start();
                btnTogglePlay.innerText = 'STOP';
                btnTogglePlay.classList.add('btn-danger');
                btnFloatPlay.innerText = '⏸';
            }
        }

        // Event Listeners for BPM updates
        bpmSlider.addEventListener('input', (e) => updateBpm(parseInt(e.target.value)));
        document.getElementById('btn-minus-five').addEventListener('click', () => updateBpm(engine.bpm - 5));
        document.getElementById('btn-plus-five').addEventListener('click', () => updateBpm(engine.bpm + 5));
        document.getElementById('btn-float-minus').addEventListener('click', () => updateBpm(engine.bpm - 1));
        document.getElementById('btn-float-plus').addEventListener('click', () => updateBpm(engine.bpm + 1));

        // Play/Pause Listeners
        btnTogglePlay.addEventListener('click', togglePlayback);
        btnFloatPlay.addEventListener('click', togglePlayback);

        // Toggle Floating Overlay
        document.getElementById('btn-toggle-overlay').addEventListener('click', () => {
            floatingWidget.classList.toggle('hidden');
        });

        // Render Presets
        function renderPresets() {
            presetList.innerHTML = '';
            const presets = presetStore.getPresets();
            
            presets.forEach(preset => {
                const li = document.createElement('li');
                li.className = 'preset-item';
                li.innerHTML = `
                    <span><strong>${preset.name}</strong> (${preset.bpm} BPM)</span>
                    <div>
                        <button onclick="updateBpm(${preset.bpm})">Load</button>
                        <button class="btn-danger" onclick="removePreset(${preset.id})">✕</button>
                    </div>
                `;
                presetList.appendChild(li);
            });
        }

        // Save & Delete Presets
        document.getElementById('btn-save-preset').addEventListener('click', () => {
            const nameInput = document.getElementById('preset-name');
            if (nameInput.value.trim() !== '') {
                presetStore.savePreset(nameInput.value.trim(), engine.bpm);
                nameInput.value = '';
                renderPresets();
            }
        });

        window.removePreset = function(id) {
            presetStore.deletePreset(id);
            renderPresets();
        };

        // Initialize preset list on load
        renderPresets();
    </script>
</body>
</html>
