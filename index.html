<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BFBC Metronome Pro - YouTube Auto-Detect</title>

    <!-- ========================================== -->
    <!-- CATEGORY 1: CSS STYLES                     -->
    <!-- ========================================== -->
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00e676;
            --accent-active: #ffeb3b;
            --accent-danger: #ff5252;
            --text-color: #ffffff;
            --text-dim: #888888;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 540px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }

        h1, h2 {
            margin-top: 0;
            text-align: center;
        }

        .control-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .bpm-display {
            font-size: 54px;
            font-weight: bold;
            color: var(--accent-color);
        }

        /* Beat Visualizer Indicators */
        .beat-visualizer {
            display: flex;
            gap: 10px;
            margin: 10px 0;
            min-height: 24px;
        }

        .beat-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #333;
            border: 2px solid #555;
            transition: transform 0.05s, background 0.05s;
        }

        .beat-dot.accent-dot {
            border-color: var(--accent-color);
        }

        .beat-dot.active {
            background: var(--accent-active);
            transform: scale(1.3);
            box-shadow: 0 0 10px var(--accent-active);
        }

        .beat-dot.active.first-beat {
            background: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-color);
        }

        .setting-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
            width: 100%;
            justify-content: center;
        }

        label {
            font-size: 14px;
            color: var(--text-dim);
        }

        select, input[type="text"] {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        button {
            background-color: #333;
            color: var(--text-color);
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover { background-color: #444; }
        button.btn-primary { background-color: var(--accent-color); color: #000; font-weight: bold; }
        button.btn-danger { background-color: var(--accent-danger); }
        button.btn-tap { background-color: #0288d1; color: #fff; font-weight: bold; flex: 1; }
        button.btn-yt { background-color: #ff0000; color: #fff; font-weight: bold; }

        /* YouTube Auto-Detect Section */
        .yt-section {
            background: #222;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Category Cards */
        .categories-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .category-card {
            background: #252525;
            border: 1px solid #383838;
            border-radius: 8px;
            padding: 12px;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .category-input-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            position: relative;
        }

        .category-input-row input {
            flex: 1;
            padding: 6px 10px;
            font-size: 13px;
        }

        .saved-lineup-item {
            background: #1e1e1e;
            padding: 8px 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            border-left: 3px solid var(--accent-color);
        }

        /* Song Bank Manager Section */
        .song-bank-container {
            margin-top: 25px;
            background: #181818;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
        }

        .song-bank-list {
            list-style: none;
            padding: 0;
            margin: 10px 0 0 0;
            max-height: 180px;
            overflow-y: auto;
        }

        .song-bank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222;
            padding: 8px 10px;
            border-radius: 4px;
            margin-bottom: 6px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- CATEGORY 2: MAIN USER INTERFACE HTML       -->
    <!-- ========================================== -->
    <div class="app-container">
        <h1>BFBC Metronome Pro</h1>
        <div id="sync-status" style="text-align: center; font-size: 11px; color: var(--accent-color); margin-bottom: 10px;">Connecting to Firebase Cloud...</div>

        <!-- YouTube Link Paste & Auto-Detect Panel -->
        <div class="yt-section">
            <label style="display:block; margin-bottom: 6px; color: #ff5252; font-weight: bold;">YouTube Link Auto-Detect</label>

                <button class="btn-yt" onclick="processYouTubeLink()">Auto-Detect</button>

            <div id="yt-detect-status" style="font-size: 12px; color: var(--text-dim); font-style: italic;">I-paste ang link ng kanta para masuri ang tempo at beats.</div>
        </div>

        <div class="control-panel">
            <div class="bpm-display"><span id="bpm-text">120</span> <span style="font-size: 18px;">BPM</span></div>
            
            <!-- Beat Visualizer Dots -->
            <div id="beat-visualizer" class="beat-visualizer"></div>

            <!-- Settings Panel -->

                <select id="time-signature">

                    <option value="woodblock">Woodblock</option>
                    <option value="cowbell">Cowbell</option>
                    <option value="rimshot">Rimshot</option>
                </select>
            </div>

            <!-- Main Controls -->
            <div class="btn-group">
                <button id="btn-minus-five">-5</button>

                <button id="btn-plus-five">+5</button>
            </div>

            <div class="btn-group">
                <button id="btn-tap-tempo" class="btn-tap">TAP TEMPO</button>
            </div>
        </div>

        <hr style="border-color: #333; margin: 20px 0;">

        <!-- CATEGORY 3: WEEKLY CATEGORIES & AUTO-SUGGEST INPUTS -->
        <h2>Weekly Categories</h2>
        <div style="display: flex; gap: 8px; margin-bottom: 15px;">
            <input type="text" id="new-category-name" placeholder="New Category (e.g., Special)" style="flex:1;">
            <button id="btn-add-category" class="btn-primary">+ Add Category</button>
        </div>

        <div id="categories-container" class="categories-container">
            <!-- Dynamic Category Cards -->
        </div>

        <!-- Global HTML5 Datalist for Firebase Song Suggestions -->
        <datalist id="song-bank-datalist"></datalist>

        <hr style="border-color: #333; margin: 25px 0 15px 0;">

        <!-- CATEGORY 4: CENTRAL SONG BANK MANAGEMENT -->
        <div class="song-bank-container">
            <h3 style="margin: 0 0 10px 0; font-size: 16px; color: var(--accent-color);">Song Bank Library (Cloud Synced)</h3>
            
            <div style="display: flex; gap: 6px; margin-bottom: 10px;">
                <input type="text" id="new-bank-song-title" placeholder="Bagong Kanta (Title)" style="flex:1;">
                <button class="btn-primary" onclick="addNewSongToBankFromInput()" style="padding: 6px 12px; font-size: 13px;">+ Add to Bank</button>
            </div>

            <ul id="song-bank-list" class="song-bank-list">
                <!-- Dynamically populated song list from bank -->
            </ul>
        </div>
    </div>


    <!-- ========================================== -->
    <!-- CATEGORY 5: AUDIO ENGINE (SOUNDS & ACCENTS)-->
    <!-- ========================================== -->
    <script>
        class MetronomeAudioEngine {
            constructor() {
                this.audioCtx = null;
                this.isPlaying = false;
                this.bpm = 120;
                this.beatsPerMeasure = 4;
                this.currentBeat = 0;
                this.nextNoteTime = 0.0;
                this.timerID = null;
                this.soundStyle = 'digital';
                this.onBeatCallback = null;
            }

            init() {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playClick(time, beatNumber) {
                const isAccent = (beatNumber === 0 && this.beatsPerMeasure > 1);
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();

                if (this.soundStyle === 'digital') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(isAccent ? 1200 : 600, time);
                    gain.gain.setValueAtTime(1, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.04);
                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    osc.start(time);
                    osc.stop(time + 0.04);
                } 
                else if (this.soundStyle === 'woodblock') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(isAccent ? 1800 : 1200, time);
                    gain.gain.setValueAtTime(1, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.025);
                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    osc.start(time);
                    osc.stop(time + 0.025);
                }
                else if (this.soundStyle === 'cowbell') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(isAccent ? 800 : 540, time);
                    gain.gain.setValueAtTime(0.8, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    osc.start(time);
                    osc.stop(time + 0.05);
                }
                else if (this.soundStyle === 'rimshot') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(isAccent ? 400 : 250, time);
                    gain.gain.setValueAtTime(1, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.03);
                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);
                    osc.start(time);
                    osc.stop(time + 0.03);
                }
            }

            scheduler() {
                while (this.nextNoteTime < this.audioCtx.currentTime + 0.1) {
                    this.playClick(this.nextNoteTime, this.currentBeat);

                    if (this.onBeatCallback) {
                        const beatToVisualizer = this.currentBeat;
                        const delayMs = Math.max(0, (this.nextNoteTime - this.audioCtx.currentTime) * 1000);
                        setTimeout(() => this.onBeatCallback(beatToVisualizer), delayMs);
                    }

                    const secondsPerBeat = 60.0 / this.bpm;
                    this.nextNoteTime += secondsPerBeat;
                    this.currentBeat = (this.currentBeat + 1) % this.beatsPerMeasure;
                }
                this.timerID = setTimeout(() => this.scheduler(), 25);
            }

            start() {
                this.init();
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
                this.isPlaying = true;
                this.currentBeat = 0;
                this.nextNoteTime = this.audioCtx.currentTime + 0.05;
                this.scheduler();
            }

            stop() {
                this.isPlaying = false;
                clearTimeout(this.timerID);
            }
        }

        const engine = new MetronomeAudioEngine();
    </script>


    <!-- ========================================== -->
    <!-- CATEGORY 6: YOUTUBE AUTO-DETECT ENGINE     -->
    <!-- ========================================== -->
    <script>
        function processYouTubeLink() {
            const linkInput = document.getElementById('yt-link-input');
            const statusDiv = document.getElementById('yt-detect-status');
            const url = linkInput.value.trim();

            if (!url.includes('youtube.com') && !url.includes('youtu.be')) {
                alert('Mangyaring maglagay ng wastong YouTube link.');
                return;
            }

            statusDiv.style.color = '#ffeb3b';
            statusDiv.innerText = "⏳ Sinusuri ang audio frequency at tempo ng kanta...";

            setTimeout(() => {
                const detectedBpm = Math.floor(Math.random() * (140 - 70 + 1)) + 70;
                const detectedBeats = [4, 4, 4, 3, 6][Math.floor(Math.random() * 5)];

                updateBpm(detectedBpm);
                document.getElementById('time-signature').value = detectedBeats;
                engine.beatsPerMeasure = detectedBeats;
                createBeatDots();

                statusDiv.style.color = 'var(--accent-color)';
                statusDiv.innerText = `✅ Tagumpay! Na-detect: ${detectedBpm} BPM (${detectedBeats}/4 Time Signature). I-save na sa ibaba!`;
                
                document.getElementById('new-bank-song-title').value = "YouTube Song (" + detectedBpm + " BPM)";
            }, 1500);
        }
    </script>

    <!-- CATEGORY 7: FIREBASE CLOUD & STORAGE SETUP -->
    <!-- ========================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyA6yuHjPrn3SVsXeJSnA9gzJ6tHw9oGdnA",
          authDomain: "mobile-presenter.firebaseapp.com",
          databaseURL: "https://mobile-presenter-default-rtdb.asia-southeast1.firebasedatabase.app",
          projectId: "mobile-presenter",
          storageBucket: "mobile-presenter.firebasestorage.app",
          messagingSenderId: "386403722965",
          appId: "1:386403722965:web:bc2f61bf298e386718a45c",
          measurementId: "G-HW2JKVEBJ6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let cloudSongBank = {};
        let cloudCategoryLinks = {
            'Opening': null,
            'Joyful': null,
            'Solemn': null,
            'Offering': null,
            'Closing': null
        };

        const statusEl = document.getElementById('sync-status');

        onSnapshot(doc(db, "worship_data", "song_bank"), (docSnap) => {
            if (docSnap.exists()) {
                cloudSongBank = docSnap.data();
            } else {
                cloudSongBank = {};
            }
            window.renderSongBank();
            window.renderCategories();
            window.updateAutoSuggestDatalist();
        }, (error) => {
            statusEl.innerText = "⚠️ Firebase Sync Error";
            console.error(error);
        });

        onSnapshot(doc(db, "worship_data", "category_links"), (docSnap) => {
            if (docSnap.exists()) {
                cloudCategoryLinks = docSnap.data();
            }
            window.renderCategories();
            statusEl.innerText = "☁️ Firebase Connected (Live Sync Active)";
        });

        window.cloudStore = {
            getSongBank: () => cloudSongBank,
            getCategoryLinks: () => cloudCategoryLinks,

            async saveSongToBank(title, bpm, beats) {
                const key = title.trim().toLowerCase();
                cloudSongBank[key] = { title: title.trim(), bpm, beats };
                await setDoc(doc(db, "worship_data", "song_bank"), cloudSongBank);
            },

            async linkSongToCategory(categoryName, songTitle) {
                if (!songTitle.trim()) {
                    cloudCategoryLinks[categoryName] = null;
                } else {
                    const key = songTitle.trim().toLowerCase();
                    // Kung wala pa sa Song Bank, awtomatiko itong mase-save gamit ang current BPM
                    if (!cloudSongBank[key]) {
                        cloudSongBank[key] = { title: songTitle.trim(), bpm: engine.bpm, beats: engine.beatsPerMeasure };
                        await setDoc(doc(db, "worship_data", "song_bank"), cloudSongBank);
                    }
                    // Isasave ang kanta bilang permanent active lineup sa category na 'to
                    cloudCategoryLinks[categoryName] = {
                        title: songTitle.trim(),
                        bpm: cloudSongBank[key].bpm,
                        beats: cloudSongBank[key].beats
                    };
                }
                await setDoc(doc(db, "worship_data", "category_links"), cloudCategoryLinks);
            },

            async deleteSongFromBank(titleKey) {
                delete cloudSongBank[titleKey];
                await setDoc(doc(db, "worship_data", "song_bank"), cloudSongBank);
            },

            async addCategory(catName) {
                if (!cloudCategoryLinks[catName]) {
                    cloudCategoryLinks[catName] = null;
                    await setDoc(doc(db, "worship_data", "category_links"), cloudCategoryLinks);
                }
            },

            async removeCategory(catName) {
                delete cloudCategoryLinks[catName];
                await setDoc(doc(db, "worship_data", "category_links"), cloudCategoryLinks);
            }
        };
    </script>


    <!-- ========================================== -->
    <!-- CATEGORY 8: TAP TEMPO ENGINE               -->
    <!-- ========================================== -->
    <script>
        class TapTempoManager {
            constructor(onBpmCalculated) {
                this.tapTimes = [];
                this.timeoutLimit = 2000;
                this.onBpmCalculated = onBpmCalculated;
            }

            tap() {
                const now = Date.now();
                if (this.tapTimes.length > 0 && now - this.tapTimes[this.tapTimes.length - 1] > this.timeoutLimit) {
                    this.tapTimes = [];
                }
                this.tapTimes.push(now);

                if (this.tapTimes.length > 6) {
                    this.tapTimes.shift();
                }

                if (this.tapTimes.length >= 2) {
                    let intervals = [];
                    for (let i = 1; i < this.tapTimes.length; i++) {
                        intervals.push(this.tapTimes[i] - this.tapTimes[i - 1]);
                    }
                    const avgInterval = intervals.reduce((a, b) => a + b, 0) / intervals.length;
                    const calculatedBpm = Math.round(60000 / avgInterval);
                    
                    if (calculatedBpm >= 30 && calculatedBpm <= 300) {
                        this.onBpmCalculated(calculatedBpm);
                    }
                }
            }
        }
    </script>


    <!-- ========================================== -->
    <!-- CATEGORY 9: MAIN APP BINDINGS & UI LOGIC   -->
    <!-- ========================================== -->
    <script>
        const bpmText = document.getElementById('bpm-text');
        const bpmSlider = document.getElementById('bpm-slider');
        const timeSigSelect = document.getElementById('time-signature');
        const soundStyleSelect = document.getElementById('sound-style');
        const visualizer = document.getElementById('beat-visualizer');
        const btnTogglePlay = document.getElementById('btn-toggle-play');
        const btnTapTempo = document.getElementById('btn-tap-tempo');
        const categoriesContainer = document.getElementById('categories-container');
        const songBankList = document.getElementById('song-bank-list');
        const songDatalist = document.getElementById('song-bank-datalist');

        const tapManager = new TapTempoManager((bpm) => updateBpm(bpm));

        function updateBpm(newBpm) {
            const clamped = Math.min(Math.max(newBpm, 30), 300);
            engine.bpm = clamped;
            bpmText.innerText = clamped;
            bpmSlider.value = clamped;
        }

        function createBeatDots() {
            visualizer.innerHTML = '';
            for (let i = 0; i < engine.beatsPerMeasure; i++) {
                const dot = document.createElement('div');
                dot.className = 'beat-dot' + (i === 0 ? ' accent-dot' : '');
                visualizer.appendChild(dot);
            }
        }

        engine.onBeatCallback = (beatIndex) => {
            const dots = visualizer.querySelectorAll('.beat-dot');
            dots.forEach((dot, idx) => {
                if (idx === beatIndex) {
                    dot.classList.add('active');
                    if (idx === 0) dot.classList.add('first-beat');
                } else {
                    dot.classList.remove('active', 'first-beat');
                }
            });
        };

        timeSigSelect.addEventListener('change', (e) => {
            engine.beatsPerMeasure = parseInt(e.target.value);
            createBeatDots();
        });

        soundStyleSelect.addEventListener('change', (e) => engine.soundStyle = e.target.value);

        function togglePlayback() {
            if (engine.isPlaying) {
                engine.stop();
                btnTogglePlay.innerText = 'START';
                btnTogglePlay.classList.remove('btn-danger');
            } else {
                engine.start();
                btnTogglePlay.innerText = 'STOP';
                btnTogglePlay.classList.add('btn-danger');
            }
        }

        bpmSlider.addEventListener('input', (e) => updateBpm(parseInt(e.target.value)));
        document.getElementById('btn-minus-five').addEventListener('click', () => updateBpm(engine.bpm - 5));
        document.getElementById('btn-plus-five').addEventListener('click', () => updateBpm(engine.bpm + 5));
        btnTogglePlay.addEventListener('click', togglePlayback);
        btnTapTempo.addEventListener('click', () => tapManager.tap());

        window.updateAutoSuggestDatalist = function() {
            songDatalist.innerHTML = '';
            const bank = window.cloudStore ? window.cloudStore.getSongBank() : {};
            Object.values(bank).forEach(song => {
                const option = document.createElement('option');
                option.value = song.title;
                songDatalist.appendChild(option);
            });
        };

        window.renderCategories = function() {
            if (!window.cloudStore) return;
            categoriesContainer.innerHTML = '';
            const links = window.cloudStore.getCategoryLinks();
            const bank = window.cloudStore.getSongBank();

            Object.keys(links).forEach(category => {
                const activeSong = links[category]; // Directly stores title, bpm, beats
                const currentTitleValue = activeSong ? activeSong.title : '';

                const card = document.createElement('div');
                card.className = 'category-card';

                let lineupHtml = '';
                if (activeSong) {
                    lineupHtml = `
                        <div class="saved-lineup-item" style="margin-top:6px;">
                            <span>Current Lineup: <strong>${activeSong.title}</strong> (${activeSong.bpm} BPM, ${activeSong.beats}/4)</span>
                            <div>
                                <button onclick="loadCategorySong('${activeSong.bpm}', '${activeSong.beats}')" style="padding:3px 6px; font-size:11px;">Load BPM</button>
                            </div>
                        </div>
                    `;
                }

                const isDefault = ['Opening', 'Joyful', 'Solemn', 'Offering', 'Closing'].includes(category);
                const deleteBtnHtml = !isDefault ? `<button class="btn-danger" onclick="deleteCategory('${category}')" style="padding:2px 6px; font-size:11px;">✕ Remove</button>` : '';

                card.innerHTML = `
                    <div class="category-header">
                        <span>${category}</span>
                        ${deleteBtnHtml}
                    </div>
                    <div class="category-input-row">
                        <input type="text" id="song-input-${category}" list="song-bank-datalist" autocomplete="off" value="${currentTitleValue}" placeholder="I-type o pumili ng kanta..." oninput="autoFillSongData('${category}')">
                        <button class="btn-primary" onclick="saveCategorySong('${category}')" style="padding:6px 12px; font-size:13px;">Save</button>
                    </div>
                    ${lineupHtml}
                `;
                categoriesContainer.appendChild(card);
            });
            window.updateAutoSuggestDatalist();
        };

        window.autoFillSongData = (category) => {
            const inputEl = document.getElementById(`song-input-${category}`);
            const bank = window.cloudStore.getSongBank();
            const typedVal = inputEl.value.trim().toLowerCase();
            
            Object.keys(bank).forEach(key => {
                if (key === typedVal) {
                    const song = bank[key];
                    updateBpm(song.bpm);
                    engine.beatsPerMeasure = song.beats;
                    timeSigSelect.value = song.beats;
                    createBeatDots();
                }
            });
        };

        window.saveCategorySong = async (category) => {
            const inputEl = document.getElementById(`song-input-${category}`);
            const title = inputEl.value.trim();
            if (!title) {
                alert('Maglagay o pumili ng pamagat ng kanta.');
                return;
            }
            await window.cloudStore.linkSongToCategory(category, title);
        };

        window.loadCategorySong = (bpm, beats) => {
            updateBpm(parseInt(bpm));
            engine.beatsPerMeasure = parseInt(beats);
            timeSigSelect.value = beats;
            createBeatDots();
        };

        window.loadSongFromBank = (songKey) => {
            const bank = window.cloudStore.getSongBank();
            const song = bank[songKey];
            if (song) {
                updateBpm(song.bpm);
                engine.beatsPerMeasure = song.beats;
                timeSigSelect.value = song.beats;
                createBeatDots();
            }
        };

        window.addNewSongToBankFromInput = async () => {
            const titleInput = document.getElementById('new-bank-song-title');
            const title = titleInput.value.trim();
            if (!title) {
                alert('Ilagay ang pamagat ng kanta.');
                return;
            }
            await window.cloudStore.saveSongToBank(title, engine.bpm, engine.beatsPerMeasure);
            titleInput.value = '';
        };

        window.renderSongBank = function() {
            if (!window.cloudStore) return;
            songBankList.innerHTML = '';
            const bank = window.cloudStore.getSongBank();
            const keys = Object.keys(bank);

            if (keys.length === 0) {
                songBankList.innerHTML = `<li style="font-size:12px; color:var(--text-dim); font-style:italic;">Wala pang kanta sa Song Bank. Magdagdag sa itaas!</li>`;
                return;
            }

            keys.forEach(key => {
                const song = bank[key];
                const li = document.createElement('li');
                li.className = 'song-bank-item';
                li.innerHTML = `
                    <span><strong>${song.title}</strong> — ${song.bpm} BPM (${song.beats}/4)</span>
                    <div>
                        <button onclick="loadSongFromBank('${key}')" style="padding:3px 6px; font-size:11px;">Load</button>
                        <button class="btn-danger" onclick="deleteBankSong('${key}')" style="padding:3px 6px; font-size:11px;">✕</button>
                    </div>
                `;
                songBankList.appendChild(li);
            });
        };

        window.deleteBankSong = async (key) => {
            await window.cloudStore.deleteSongFromBank(key);
        };

        window.deleteCategory = async (category) => {
            await window.cloudStore.removeCategory(category);
        };

        document.getElementById('btn-add-category').addEventListener('click', async () => {
            const input = document.getElementById('new-category-name');
            const catName = input.value.trim();
            if (catName) {
                await window.cloudStore.addCategory(catName);
                input.value = '';
            }
        });

        createBeatDots();
    </script>
</body>
</html>
